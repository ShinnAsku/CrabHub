[package]
name = "crabhub"
version = "1.0.0"
description = "CrabHub - A lightweight database management tool with AI assistance"
authors = ["CrabHub"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.95"
default-run = "crabhub"

[workspace]
members = ["crates/crabhub-core"]
resolver = "2"

[lib]
name = "crabhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = [
	"dep:tauri", "dep:tauri-build", "dep:tauri-plugin-log", "dep:tauri-plugin-dialog",
	"dep:tauri-plugin-fs", "dep:tauri-plugin-secure-storage",
	"dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-updater",
]

[[bin]]
name = "crabhub"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
crabhub-core = { path = "crates/crabhub-core" }
serde_json = "1"
shlex = "1.3"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [], optional = true }
tokio-util = { version = "0.7", features = ["rt", "compat"] }
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-secure-storage = { version = "1.4", optional = true }
uuid = { version = "1", features = ["serde", "v4"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
sqlformat = "0.3"
dirs = "5.0.1"
futures = "0.3"
futures-util = "0.3"
pbkdf2 = "0.12"
rand = "0.8"
sha2 = "0.10"
base64 = "0.21"
keyring = "2.0"
tauri-plugin-clipboard-manager = { version = "2.3.2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
# Plugin system dependencies
jsonrpsee = { version = "0.22", features = ["server", "client", "macros"] }
tempfile = "3.10"

anyhow = "1.0"
rust_xlsxwriter = "0.92.0"
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
tower-http = { version = "0.7.0", features = ["fs", "cors"] }
env_logger = "0.11.11"
