[package]
name = "crabhub-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[dependencies]
oracle = "0.6.3"
tokio-dameng = "=0.1.0"
dameng-types = "=0.1.0"
yashandb = "=0.1.0"
odbc-api = { version = "29", default-features = false, features = ["odbc_version_3_80"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tokio-util = { version = "0.7", features = ["rt", "compat"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
ssh2 = "0.9"
async-ssh2-lite = { version = "0.5", default-features = false, features = ["tokio"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "rust_decimal", "chrono", "uuid", "ipnetwork", "mac_address"] }
rust_decimal = "1.33"
uuid = { version = "1", features = ["serde", "v4"] }
ipnetwork = "0.20"
mac_address = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
tokio-gaussdb = { git = "https://github.com/ShinnAsku/gaussdb-rs.git", rev = "1600f90b" }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
sqlformat = "0.3"
sqlparser = { version = "0.59", default-features = false, features = ["std", "visitor"] }
dirs = "5.0.1"
futures = "0.3"
futures-util = "0.3"
urlencoding = "2.1"
regex = "1.10"
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
sha2 = "0.10"
base64 = "0.21"
keyring = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
jsonrpsee = { version = "0.22", features = ["server", "client", "macros"] }
tempfile = "3.10"
zip = "0.6"
anyhow = "1.0"
redis = { version = "0.32.2", features = ["tokio-comp", "connection-manager"] }
mongodb = "3.2.5"

[target.'cfg(windows)'.dependencies]
ssh2 = { version = "0.9", features = ["openssl-on-win32"] }